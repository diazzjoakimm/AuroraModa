<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo — Aurora Moda</title>
  <meta name="description" content="Catálogo minorista y mayorista de vinchas y accesorios de Aurora Moda.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="icon-vincha" viewBox="0 0 200 120"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M14 100C14 38 60 14 100 14s86 24 86 86"/><path d="M26 100C26 48 64 27 100 27s74 21 74 73"/><path d="M14 100h12M174 100h12"/></g></symbol>
    <symbol id="icon-whatsapp" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8c-1-.4-1.8-1.2-2.2-2.2l.8-1-1-2z"/></g></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="header is-scrolled">
    <a class="brand" href="index.html" aria-label="Aurora Moda — inicio"><img class="brand__logo" src="logo.png" alt=""><span class="brand__moda">Moda</span></a>
    <a class="link-btn" href="index.html">Volver al inicio</a>
  </header>

  <main class="section page-cat">
    <div class="container">
      <header class="section__head">
        <h1 class="section__title" id="cat-title">Catálogo</h1>
        <p class="section__lead" id="cat-lead"></p>
      </header>
      <div class="tabs" role="tablist" aria-label="Tipo de catálogo">
        <button class="tab" type="button" role="tab" data-line="minorista">Minorista</button>
        <button class="tab" type="button" role="tab" data-line="mayorista">Mayorista</button>
      </div>
      <div class="catalog__grid" id="grid" aria-live="polite"></div>
    </div>
  </main>

  <div class="modal" id="product-modal" role="dialog" aria-modal="true" aria-labelledby="product-title" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog modal__dialog--lg">
      <button class="modal__close" type="button" data-close aria-label="Cerrar"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
      <div class="product">
        <div class="product__gallery">
          <div class="product__main"><img id="product-main" alt=""></div>
          <div class="product__thumbs" id="product-thumbs"></div>
        </div>
        <div class="product__info">
          <p class="eyebrow">Aurora Moda</p>
          <h2 class="modal__title" id="product-title"></h2>
          <p class="product__price" id="product-price"></p>
          <p class="product__desc" id="product-desc"></p>
          <a class="btn btn--dark" id="product-inquire" href="#" target="_blank" rel="noopener"><span>Consultar por WhatsApp</span><svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a>
        </div>
      </div>
    </div>
  </div>
  <a class="wa-fab" href="https://wa.me/5491149754536?text=Hola%20Aurora!%20Quiero%20hacer%20una%20consulta" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp"><svg class="icon" aria-hidden="true"><use href="#icon-whatsapp"/></svg></a>
  <script src="catalogo.js"></script>
</body>
</html>
